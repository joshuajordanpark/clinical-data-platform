name: Python Tests # identifies the workflow in Github

on: # specifies an event to trigger
  pull_request: # specifies the event (pull request) to trigger
    branches: 
      - main #restricts it to the main branch

jobs:
  test:
    runs-on: ubuntu-latest # specifies the OS to run the job on

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest -v